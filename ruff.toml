line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # long lines are common in Arabic prompt strings
  "RUF001", # Arabic-Indic characters are intentional
  "RUF002",
  "RUF003",
  "B008",   # FastAPI Depends/Query in defaults is idiomatic
  "SIM108",
  "UP042",   # str+Enum is the standard Pydantic pattern
]

[lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"app/api/v1/routes/*" = ["B008"]
"app/llm/prompts.py" = ["E501"]
