[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -q --strict-markers
# A test that reaches the network, a database socket or a blocking call can hang
# the whole run forever. The suite is meant to be hermetic and fast, so any test
# that has not finished in this many seconds is a bug, not a slow machine.
timeout = 120
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning
