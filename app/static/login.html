<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#132030">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/ui/icons/icon-192.png">
<link rel="apple-touch-icon" href="/ui/icons/icon-192.png">
<title>تسجيل الدخول — المنصة القضائية القانونية اليمنية</title>
<link rel="stylesheet" href="/ui/portal.css">
</head>
<body>
<noscript><div class="wrap"><div class="warn">يتطلب تسجيل الدخول تشغيل JavaScript.</div></div></noscript>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <img src="/ui/icons/icon-192.png" alt="">
      <h1>تسجيل الدخول</h1>
    </div>
    <p class="sub">سجّل الدخول للوصول إلى بوابتك ومساحة العمل القانونية.</p>
    <label>اسم المستخدم أو البريد الإلكتروني</label>
    <input id="loginUser" autocomplete="username" autofocus>
    <label>كلمة المرور</label>
    <input id="loginPass" type="password" autocomplete="current-password">
    <div class="err hide" id="loginErr"></div>
    <div class="actions"><button class="primary" id="loginBtn">دخول</button></div>
    <div id="googleWrap" class="hide">
      <div class="or"><span>أو</span></div>
      <a class="google-btn" id="googleBtn" href="/api/v1/auth/google/authorize">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>الدخول باستخدام جوجل</span>
      </a>
    </div>
    <p class="sub" style="margin-top:14px">
      <a href="/ui/forgot.html">نسيت كلمة المرور؟</a>
    </p>
    <p class="sub" style="margin-top:8px">ليس لديك حساب؟ <a href="/ui/signup.html">إنشاء حساب جديد</a></p>
    <p class="sub" style="margin-top:8px"><a href="/ui/landing.html">← العودة إلى الصفحة التعريفية</a></p>
  </div>
</div>

<script src="/ui/install.js"></script>
<script src="/ui/portal.js"></script>
<script>
  (function () {
    "use strict";
    const P = window.Portal;
    const params = new URLSearchParams(location.search);
    // Only ever redirect to a same-site /ui/ page, so ?next= cannot be used to
    // bounce the user to another origin after login.
    const next = params.get("next") || "";
    const target = next.startsWith("/ui/") ? next : "";

    function fail(message) {
      const box = document.getElementById("loginErr");
      box.textContent = message;
      box.classList.remove("hide");
    }

    async function doLogin() {
      const username = document.getElementById("loginUser").value.trim();
      const password = document.getElementById("loginPass").value;
      if (!username || !password) return fail("أدخل اسم المستخدم وكلمة المرور");
      document.getElementById("loginBtn").disabled = true;
      try {
        const session = await P.auth.login(username, password);
        location.href = target || session.role_portal_page || "/ui/workspace.html";
      } catch (e) {
        fail(e.message);
        document.getElementById("loginBtn").disabled = false;
      }
    }

    document.getElementById("loginBtn").onclick = doLogin;
    document.getElementById("loginPass").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });

    // Show the Google button only when the platform has it configured.
    P.auth.googleStatus().then((status) => {
      if (status && status.enabled) {
        document.getElementById("googleWrap").classList.remove("hide");
      }
    });

    const errors = {
      google_disabled: "تسجيل الدخول عبر جوجل غير مُفعَّل على هذه المنصة.",
      google_cancelled: "تم إلغاء الدخول عبر جوجل.",
      google_state: "انتهت صلاحية جلسة الدخول عبر جوجل، حاول مرة أخرى.",
    };
    const error = params.get("error");
    if (error && errors[error]) fail(errors[error]);

    // A visitor who already holds a valid session skips the form entirely.
    P.auth.me().then((user) => {
      if (!user) return;
      location.href = target || "/ui/workspace.html";
    }).catch(() => {});
  })();
</script>
</body>
</html>
