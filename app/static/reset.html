<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#132030">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/ui/icons/icon-192.png">
<link rel="apple-touch-icon" href="/ui/icons/icon-192.png">
<title>تعيين كلمة مرور جديدة — المنصة القضائية القانونية اليمنية</title>
<link rel="stylesheet" href="/ui/portal.css">
</head>
<body>
<noscript><div class="wrap"><div class="warn">يتطلب هذا النموذج تشغيل JavaScript.</div></div></noscript>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <img src="/ui/icons/icon-192.png" alt="">
      <h1>تعيين كلمة مرور جديدة</h1>
    </div>
    <p class="sub">اختر كلمة مرور قوية جديدة لحسابك.</p>
    <label>كلمة المرور الجديدة</label>
    <input id="password" type="password" autocomplete="new-password" autofocus>
    <div class="hint">8 أحرف على الأقل، وتجمع بين حروف وأرقام</div>
    <label style="margin-top:14px">تأكيد كلمة المرور</label>
    <input id="confirm" type="password" autocomplete="new-password">
    <div class="err hide" id="msg"></div>
    <div class="ok hide" id="ok"></div>
    <div class="actions"><button class="primary" id="resetBtn">تعيين كلمة المرور</button></div>
    <p class="sub" style="margin-top:14px"><a href="/ui/login.html">← العودة إلى تسجيل الدخول</a></p>
  </div>
</div>

<script src="/ui/install.js"></script>
<script src="/ui/portal.js"></script>
<script>
  (function () {
    "use strict";
    const P = window.Portal;
    const $ = (id) => document.getElementById(id);
    const token = new URLSearchParams(location.search).get("token") || "";

    function fail(message) {
      $("ok").classList.add("hide");
      const box = $("msg");
      box.textContent = message;
      box.classList.remove("hide");
    }
    function succeed(message) {
      $("msg").classList.add("hide");
      const box = $("ok");
      box.textContent = message;
      box.classList.remove("hide");
      $("resetBtn").disabled = true;
      setTimeout(() => { location.href = "/ui/login.html"; }, 2500);
    }

    if (!token) {
      fail("رابط إعادة التعيين غير صالح. اطلب رابطاً جديداً من صفحة الاستعادة.");
      $("resetBtn").disabled = true;
    }

    async function reset() {
      const password = $("password").value;
      const confirm = $("confirm").value;
      if (password !== confirm) return fail("كلمتا المرور غير متطابقتين");
      $("resetBtn").disabled = true;
      try {
        const result = await P.auth.resetPassword(token, password);
        succeed(result.message || "تم تعيين كلمة المرور، جارٍ تحويلك لتسجيل الدخول…");
      } catch (e) {
        fail(e.message);
        $("resetBtn").disabled = false;
      }
    }

    $("resetBtn").onclick = reset;
    $("confirm").addEventListener("keydown", (e) => { if (e.key === "Enter") reset(); });
  })();
</script>
</body>
</html>
