services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
    restart: unless-stopped
    volumes:
      - ./var/uploads:/app/var/uploads

  # Optional: a local Postgres + pgvector for development without Supabase.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
      POSTGRES_DB: legal_ai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
