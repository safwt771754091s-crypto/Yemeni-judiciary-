name: Android APK

# Builds the WebView shell under android/ and uploads the signed release APK.
# The platform URL is baked in at build time, so this both verifies the app
# still compiles and produces the artifact published on /ui/install.html.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      platform_url:
        description: "Platform URL to bake into the APK"
        required: false
        default: "https://yemeni-judiciary.vercel.app"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform and build tools
        # GitHub-hosted runners ship the Android SDK, but its cmdline-tools are
        # not on PATH. android-actions/setup-android tries to install the removed
        # legacy "tools" package and fails, so the path is set here instead.
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          export PATH="$CMDLINE:$SDK/platform-tools:$PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PplatformUrl="${{ github.event.inputs.platform_url || 'https://yemeni-judiciary.vercel.app' }}"

      - name: Sign APK
        # The keystore is a private key, so it is provided as base64 secrets.
        # Without them the job still builds and verifies an unsigned APK.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=app/build/outputs/apk/release/app-release.apk
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets configured; publishing unsigned APK"
            cp "$UNSIGNED" "$OUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/34.0.0)
          "$BT/zipalign" -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT"

      - name: Checksum
        working-directory: android
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: yemeni-legal-ai-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
