# Keep dependencies current. Dependabot opens the pull requests; the
# "Dependabot auto-merge" workflow merges them once CI is green.
#
# Two ecosystems:
#   * pip            - requirements.txt / requirements-dev.txt
#   * github-actions - the action versions used in .github/workflows
#
# Minor and patch bumps are grouped into a single pull request per ecosystem to
# keep the queue small. Major bumps stay in their own pull request so they are
# easy to spot (they are still merged when CI passes, per the auto-merge policy).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # openai 3.x cannot install alongside this stack: llama-index-llms-openai
      # requires openai<3, so every 3.x pull request fails `pip install` with
      # ResolutionImpossible. Suppress the major bump until that package widens
      # its range; minor and patch updates to openai 2.x are still proposed.
      - dependency-name: openai
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
